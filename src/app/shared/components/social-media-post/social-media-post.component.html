<div class="social-media-post-page">
  <div class="container">
    <div class="social-media-post-container">
      <div class="social-media-header">
        <h1>Postar em Redes Sociais</h1>
        <p>Publique imagens e descrições diretamente no Instagram e Google Meu Negócio.</p>
      </div>
      <mat-card>
        <mat-card-header>
          <mat-card-title>Nova Postagem</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <form [formGroup]="postForm">
            <input type="file" (change)="onImageSelected($event)" />
            <div *ngIf="imagePreview">
              <img [src]="imagePreview" alt="Preview" style="max-width: 100%; max-height: 200px;" />
            </div>
            <mat-form-field appearance="fill">
              <mat-label>Descrição da postagem</mat-label>
              <textarea matInput formControlName="description"></textarea>
            </mat-form-field>
            <div class="platforms">
              <mat-checkbox formControlName="instagram">Instagram</mat-checkbox>
              <mat-checkbox formControlName="googleMyBusiness">Google Meu Negócio</mat-checkbox>
            </div>
          </form>
        </mat-card-content>
        <mat-card-actions>
          <button mat-raised-button color="primary" (click)="submitPost()">Publicar</button>
        </mat-card-actions>
      </mat-card>
      <app-admin-back-btn></app-admin-back-btn>
    </div>
  </div>
</div>
