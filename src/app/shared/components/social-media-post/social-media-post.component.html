<div class="social-media-post-page">
  <div class="container">
    <div class="social-media-post-container">
        <!-- Removido mat-card para evitar card duplo e garantir o formulário amplo -->
        <form [formGroup]="postForm" class="quote-form">
          <div class="social-media-header">
            <h1>Postar em Redes Sociais</h1>
            <p>Publique imagens e descrições diretamente no Instagram e Google Meu Negócio.</p>
          </div>
        <div class="form-group">
          <label for="image">Imagem</label>
          <div class="image-upload-area">
            <label for="image" class="custom-upload-label">
              <input type="file" id="image" (change)="onImageSelected($event)" class="form-control-file" hidden />
              <span class="upload-btn">
                <i class="bx bx-upload"></i> Selecionar imagem
              </span>
            </label>
            <div *ngIf="imagePreview" class="image-preview">
              <img [src]="imagePreview" alt="Preview" />
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="description">Descrição da postagem</label>
          <textarea id="description" class="form-control" formControlName="description"></textarea>
        </div>
        <div class="form-group">
          <label>Plataformas</label>
          <div class="platforms">
            <mat-checkbox formControlName="instagram">Instagram</mat-checkbox>
            <mat-checkbox formControlName="googleMyBusiness">Google Meu Negócio</mat-checkbox>
          </div>
        </div>
        <div class="form-actions">
          <button mat-raised-button color="primary" class="btn btn-lg" (click)="submitPost()">Publicar</button>
        </div>
      </form>
      <app-admin-back-btn></app-admin-back-btn>
    </div>
  </div>
</div>
